name: Build ARMv7 Python Environment cross

on:
  workflow_dispatch:

jobs:
  build-docker:
    runs-on: ubuntu-24.04-arm

    steps:
      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================================
      # QEMU
      # ========================================================

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm


      # ========================================================
      # BUILDX
      # ========================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ========================================================
      # BUILD
      # ========================================================

      - name: Build ARMv7 Docker image
        run: |
          docker buildx build \
            --platform linux/arm/v7 \
            --file Dockerfile.armv7 \
            --tag kindle-python-armv7:latest \
            --load \
            .


      # ========================================================
      # VERIFY
      # ========================================================

      - name: Verify Python
        run: |
          docker run --rm \
            --platform linux/arm/v7 \
            kindle-python-armv7:latest \
            /opt/python-3.7.5/bin/python3 \
            --version

          docker run --rm \
            --platform linux/arm/v7 \
            kindle-python-armv7:latest \
            /opt/python-3.7.5/bin/python3 \
            -c 'import ssl; print(ssl.OPENSSL_VERSION)'

          docker run --rm \
            --platform linux/arm/v7 \
            kindle-python-armv7:latest \
            /opt/python-3.7.5/bin/python3 \
            -c 'import platform; print(platform.machine())'

          docker run --rm \
            --platform linux/arm/v7 \
            kindle-python-armv7:latest \
            /opt/python-3.7.5/bin/python3 \
            -c 'import struct; print(str(struct.calcsize("P") * 8) + "-bit")'


      # ========================================================
      # VERIFY MODULES
      # ========================================================

      - name: Verify tkinter
        run: |
          docker run --rm \
            --platform linux/arm/v7 \
            kindle-python-armv7:latest \
            /opt/python-3.7.5/bin/python3 \
            -c 'import tkinter; print("tkinter OK")'

      - name: Verify FLAC
        run: |
          docker run --rm \
            --platform linux/arm/v7 \
            kindle-python-armv7:latest \
            sh -c 'ldconfig -p | grep -i flac || true'

      - name: Verify NumPy
        run: |
          docker run --rm \
            --platform linux/arm/v7 \
            kindle-python-armv7:latest \
            /opt/python-3.7.5/bin/python3 \
            -c 'import numpy; print("NumPy:", numpy.__version__)'

      - name: Verify Pillow
        run: |
          docker run --rm \
            --platform linux/arm/v7 \
            kindle-python-armv7:latest \
            /opt/python-3.7.5/bin/python3 \
            -c 'from PIL import Image; print("Pillow OK")'


      # ========================================================
      # SAVE
      # ========================================================

      - name: Save Docker image
        run: |
          docker save \
            kindle-python-armv7:latest \
            | gzip > armv7-python.tar.gz


      # ========================================================
      # SIZE
      # ========================================================

      - name: Show image size
        run: |
          ls -lh armv7-python.tar.gz


      # ========================================================
      # UPLOAD
      # ========================================================

      - name: Upload ARMv7 Docker image
        uses: actions/upload-artifact@v4
        with:
          name: armv7-python
          path: armv7-python.tar.gz
          if-no-files-found: error
          retention-days: 90
