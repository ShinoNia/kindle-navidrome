name: Build Python 3.7.5 ARMv7

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  OPENSSL_VERSION: "1.1.1w"
  PYTHON_VERSION: "3.7.5"

  TARGET: "arm-linux-gnueabihf"

  SYSROOT: "${{ github.workspace }}/sysroot"

  OPENSSL_PREFIX: "/opt/openssl"
  PYTHON_PREFIX: "/opt/python"

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # Build dependencies on ARM64 host
      # ============================================================

      - name: Install build tools
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            binutils-arm-linux-gnueabihf \
            make \
            perl \
            wget \
            curl \
            tar \
            gzip \
            xz-utils \
            zstd \
            file \
            pkg-config \
            autoconf \
            automake \
            libtool


      # ============================================================
      # QEMU
      #
      # Used only to run the final ARMv7 image.
      # ============================================================

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm


      # ============================================================
      # Buildx
      # ============================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ============================================================
      # Create ARMv7 Ubuntu 14.04 sysroot
      #
      # The ARMv7 Ubuntu container is used directly.
      #
      # We install the development packages inside the container,
      # then docker-export the resulting filesystem.
      # ============================================================

      - name: Create Ubuntu 14.04 ARMv7 sysroot
        shell: bash
        run: |
          set -eux

          rm -rf "$SYSROOT"
          mkdir -p "$SYSROOT"

# ------------------------------------------------------------
# Create an Ubuntu 14.04 ARMv7 container and use its filesystem
# as the glibc 2.19-era sysroot.
#
# IMPORTANT:
# Do NOT use --memory-swap=6g here.
# QEMU + apt/dpkg can temporarily need more memory than the
# container's RAM limit, and swap gives it somewhere to go.
# ------------------------------------------------------------

docker pull --platform linux/arm/v7 ubuntu:14.04

CID=$(docker create \
  --platform linux/arm/v7 \
  --memory=6g \
  --memory-swap=0 \
  ubuntu:14.04 \
  /bin/bash)

cleanup() {
    docker rm -f "$CID" >/dev/null 2>&1 || true
}
trap cleanup EXIT

docker start "$CID"

docker exec "$CID" bash -c '
    set -eux

    export DEBIAN_FRONTEND=noninteractive

    # --------------------------------------------------------
    # Ubuntu 14.04 is EOL.
    # --------------------------------------------------------

    sed -i \
      -e "s|http://archive.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g" \
      -e "s|http://security.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g" \
      /etc/apt/sources.list

    # --------------------------------------------------------
    # Keep apt as small as possible.
    # --------------------------------------------------------

    cat >/etc/apt/apt.conf.d/99minimal <<EOF
APT::Install-Recommends "false";
APT::Install-Suggests "false";
Acquire::Languages "none";
Acquire::CompressionTypes::Order "gz";
EOF

    # --------------------------------------------------------
    # Update package lists.
    # --------------------------------------------------------

    apt-get update

    # --------------------------------------------------------
    # Install packages one at a time.
    #
    # This is deliberately done separately because dpkg running
    # through QEMU can consume a surprisingly large amount of
    # memory during a large transaction.
    # --------------------------------------------------------

    apt-get install -y --no-install-recommends libc6-dev
    rm -rf /var/lib/apt/lists/* /var/cache/apt/*

    apt-get update
    apt-get install -y --no-install-recommends linux-libc-dev
    rm -rf /var/lib/apt/lists/* /var/cache/apt/*

    apt-get update
    apt-get install -y --no-install-recommends zlib1g-dev
    rm -rf /var/lib/apt/lists/* /var/cache/apt/*

    apt-get update
    apt-get install -y --no-install-recommends libffi-dev
    rm -rf /var/lib/apt/lists/* /var/cache/apt/*

    apt-get update
    apt-get install -y --no-install-recommends libexpat1-dev
    rm -rf /var/lib/apt/lists/* /var/cache/apt/*

    apt-get update
    apt-get install -y --no-install-recommends libbz2-dev
    rm -rf /var/lib/apt/lists/* /var/cache/apt/*

    apt-get update
    apt-get install -y --no-install-recommends libsqlite3-dev
    rm -rf /var/lib/apt/lists/* /var/cache/apt/*

    apt-get update
    apt-get install -y --no-install-recommends libncurses5-dev
    rm -rf /var/lib/apt/lists/* /var/cache/apt/*

    apt-get update
    apt-get install -y --no-install-recommends libreadline6-dev
    rm -rf /var/lib/apt/lists/* /var/cache/apt/*

    apt-get update
    apt-get install -y --no-install-recommends libgdbm-dev
    rm -rf /var/lib/apt/lists/* /var/cache/apt/*

    apt-get update
    apt-get install -y --no-install-recommends liblzma-dev
    rm -rf /var/lib/apt/lists/* /var/cache/apt/*

    # --------------------------------------------------------
    # Final cleanup.
    # --------------------------------------------------------

    rm -rf /var/lib/apt/lists/*
    rm -rf /var/cache/apt/*
    rm -rf /var/log/*
'

# ------------------------------------------------------------
# Export the actual ARMv7 container filesystem.
# ------------------------------------------------------------

mkdir -p "$SYSROOT"

docker export "$CID" | tar -C "$SYSROOT" -xf -

# Remove files that should not be part of a compiler sysroot.
rm -rf \
  "$SYSROOT/proc" \
  "$SYSROOT/sys" \
  "$SYSROOT/dev" \
  "$SYSROOT/run"

echo "ARMv7 Ubuntu 14.04 sysroot created:"
du -sh "$SYSROOT"


      # ============================================================
      # Verify cross compiler
      # ============================================================

      - name: Test cross compiler
        shell: bash
        run: |
          set -eux

          cat > "$RUNNER_TEMP/test.c" <<'EOF'
          #include <stdio.h>

          int main(void)
          {
              printf("hello ARM\n");
              return 0;
          }
          EOF

          "$TARGET-gcc" \
            --sysroot="$SYSROOT" \
            -march=armv7-a \
            -mfloat-abi=hard \
            -mfpu=vfpv3-d16 \
            "$RUNNER_TEMP/test.c" \
            -o "$RUNNER_TEMP/test"

          echo
          echo "Binary:"
          file "$RUNNER_TEMP/test"

          echo
          echo "Interpreter:"
          "$TARGET-readelf" \
            -l "$RUNNER_TEMP/test" \
            | grep interpreter


      # ============================================================
      # Download OpenSSL
      # ============================================================

      - name: Download OpenSSL
        shell: bash
        run: |
          set -eux

          mkdir -p "$RUNNER_TEMP/src"

          cd "$RUNNER_TEMP/src"

          wget -q \
            "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz"

          tar xf \
            "openssl-${OPENSSL_VERSION}.tar.gz"


      # ============================================================
      # Build OpenSSL 1.1.1w
      # ============================================================

      - name: Build OpenSSL
        shell: bash
        run: |
          set -eux

          cd "$RUNNER_TEMP/src/openssl-${OPENSSL_VERSION}"

          export CC="${TARGET}-gcc"
          export AR="${TARGET}-ar"
          export RANLIB="${TARGET}-ranlib"

          export CFLAGS="\
            --sysroot=${SYSROOT} \
            -march=armv7-a \
            -mfloat-abi=hard \
            -mfpu=vfpv3-d16 \
            -O2 \
            -fPIC
          "

          export LDFLAGS="\
            --sysroot=${SYSROOT}
          "

          ./Configure \
            linux-armv4 \
            shared \
            no-ssl3 \
            no-comp \
            no-tests \
            --cross-compile-prefix="${TARGET}-" \
            --prefix="${OPENSSL_PREFIX}" \
            --openssldir="${OPENSSL_PREFIX}/ssl"

          make -j"$(nproc)"

          make install_sw \
            DESTDIR="$RUNNER_TEMP/openssl-stage"

          # --------------------------------------------------------
          # Strip ARM binaries/libraries.
          # --------------------------------------------------------

          find \
            "$RUNNER_TEMP/openssl-stage/opt/openssl" \
            -type f \
            \( \
              -name 'openssl' \
              -o -name '*.so' \
              -o -name '*.so.*' \
            \) \
            -exec "$TARGET-strip" --strip-unneeded {} \; \
            || true

          echo
          echo "OpenSSL:"
          "$TARGET-readelf" \
            -h \
            "$RUNNER_TEMP/openssl-stage/opt/openssl/bin/openssl"


      # ============================================================
      # Download Python 3.7.5
      # ============================================================

      - name: Download Python 3.7.5
        shell: bash
        run: |
          set -eux

          cd "$RUNNER_TEMP/src"

          wget -q \
            "https://www.python.org/ftp/python/${PYTHON_VERSION}/Python-${PYTHON_VERSION}.tgz"

          tar xf \
            "Python-${PYTHON_VERSION}.tgz"


      # ============================================================
      # Build native Python 3.7.5
      #
      # This Python executes on the ARM64 build machine.
      #
      # Python 3.7 predates --with-build-python.
      # ============================================================

      - name: Build host Python
        shell: bash
        run: |
          set -eux

          cd "$RUNNER_TEMP/src/Python-${PYTHON_VERSION}"

          ./configure \
            --prefix="$RUNNER_TEMP/host-python" \
            --without-ensurepip \
            --disable-test-modules

          make -j"$(nproc)"

          make install

          "$RUNNER_TEMP/host-python/bin/python3.7" \
            --version


      # ============================================================
      # Copy Python source for ARMv7 build
      # ============================================================

      - name: Prepare ARMv7 Python source
        shell: bash
        run: |
          set -eux

          cd "$RUNNER_TEMP/src"

          rm -rf \
            "Python-${PYTHON_VERSION}-arm"

          cp -a \
            "Python-${PYTHON_VERSION}" \
            "Python-${PYTHON_VERSION}-arm"


      # ============================================================
      # Configure Python ARMv7
      # ============================================================

      - name: Configure Python ARMv7
        shell: bash
        run: |
          set -eux

          cd \
            "$RUNNER_TEMP/src/Python-${PYTHON_VERSION}-arm"

          export CC="${TARGET}-gcc"
          export CXX="${TARGET}-g++"
          export AR="${TARGET}-ar"
          export RANLIB="${TARGET}-ranlib"
          export LD="${TARGET}-ld"
          export STRIP="${TARGET}-strip"

          export CPPFLAGS="\
            --sysroot=${SYSROOT} \
            -I${SYSROOT}/usr/include \
            -I${RUNNER_TEMP}/openssl-stage/opt/openssl/include
          "

          export CFLAGS="\
            --sysroot=${SYSROOT} \
            -march=armv7-a \
            -mfloat-abi=hard \
            -mfpu=vfpv3-d16 \
            -O2 \
            -fPIC
          "

          export CXXFLAGS="${CFLAGS}"

          export LDFLAGS="\
            --sysroot=${SYSROOT} \
            -L${RUNNER_TEMP}/openssl-stage/opt/openssl/lib \
            -Wl,-rpath,/opt/openssl/lib
          "

          export LIBS="\
            -lssl \
            -lcrypto
          "

          # --------------------------------------------------------
          # Python 3.7 cross-compilation variables.
          # --------------------------------------------------------

          export HOSTPYTHON="$RUNNER_TEMP/host-python/bin/python3.7"

          export CROSS_COMPILE="${TARGET}-"
          export CROSS_COMPILE_TARGET=yes

          export HOSTARCH="arm-linux"
          export BUILDARCH="arm-linux-gnueabihf"

          # --------------------------------------------------------
          # configure cache
          #
          # Prevent configure from attempting to execute ARM
          # binaries on the ARM64 host.
          # --------------------------------------------------------

          cat > config.site <<'EOF'
          ac_cv_file__dev_ptmx=yes
          ac_cv_file__dev_ptc=no
          ac_cv_func_sem_open=yes
          ac_cv_have_long_long_format=yes
          EOF

          CONFIG_SITE="$PWD/config.site" \
          ./configure \
            --build="$(gcc -dumpmachine)" \
            --host="${TARGET}" \
            --prefix="${PYTHON_PREFIX}" \
            --enable-shared \
            --with-openssl="${RUNNER_TEMP}/openssl-stage/opt/openssl" \
            --without-ensurepip \
            --disable-test-modules \
            ac_cv_file__dev_ptmx=yes \
            ac_cv_file__dev_ptc=no


      # ============================================================
      # Build Python ARMv7
      # ============================================================

      - name: Build Python ARMv7
        shell: bash
        run: |
          set -eux

          cd \
            "$RUNNER_TEMP/src/Python-${PYTHON_VERSION}-arm"

          export CC="${TARGET}-gcc"
          export CXX="${TARGET}-g++"
          export AR="${TARGET}-ar"
          export RANLIB="${TARGET}-ranlib"
          export LD="${TARGET}-ld"
          export STRIP="${TARGET}-strip"

          export HOSTPYTHON="$RUNNER_TEMP/host-python/bin/python3.7"

          export CROSS_COMPILE="${TARGET}-"
          export CROSS_COMPILE_TARGET=yes

          export HOSTARCH="arm-linux"
          export BUILDARCH="arm-linux-gnueabihf"

          make -j"$(nproc)"


      # ============================================================
      # Install Python ARMv7
      # ============================================================

      - name: Install Python ARMv7
        shell: bash
        run: |
          set -eux

          cd \
            "$RUNNER_TEMP/src/Python-${PYTHON_VERSION}-arm"

          export HOSTPYTHON="$RUNNER_TEMP/host-python/bin/python3.7"

          export CROSS_COMPILE="${TARGET}-"
          export CROSS_COMPILE_TARGET=yes

          export HOSTARCH="arm-linux"
          export BUILDARCH="arm-linux-gnueabihf"

          make install \
            DESTDIR="$RUNNER_TEMP/python-stage"


      # ============================================================
      # Strip Python
      # ============================================================

      - name: Strip Python
        shell: bash
        run: |
          set -eux

          PYTHON_ROOT="$RUNNER_TEMP/python-stage/opt/python"

          # Python executable

          "$TARGET-strip" \
            --strip-unneeded \
            "$PYTHON_ROOT/bin/python3.7"

          # Shared libraries

          find "$PYTHON_ROOT" \
            -type f \
            -name '*.so' \
            -exec "$TARGET-strip" \
              --strip-unneeded {} \; \
            || true

          find "$PYTHON_ROOT" \
            -type f \
            -name 'libpython3.7m.so*' \
            -exec "$TARGET-strip" \
              --strip-unneeded {} \; \
            || true

          echo
          echo "Python installation:"
          du -sh "$PYTHON_ROOT"

          find "$PYTHON_ROOT/bin" -maxdepth 1 -type f -print


      # ============================================================
      # Verify resulting ARM binaries
      # ============================================================

      - name: Verify Python and OpenSSL
        shell: bash
        run: |
          set -eux

          PY="$RUNNER_TEMP/python-stage/opt/python/bin/python3.7"
          SSL="$RUNNER_TEMP/openssl-stage/opt/openssl/bin/openssl"

          echo
          echo "============================================================"
          echo "Python"
          echo "============================================================"

          file "$PY"

          echo
          "$TARGET-readelf" \
            -l "$PY" \
            | grep interpreter

          echo
          echo "Python GLIBC requirements:"

          "$TARGET-readelf" \
            --version-info "$PY" \
            | grep -o 'GLIBC_[0-9.]*' \
            | sort -Vu \
            || true

          echo
          echo "============================================================"
          echo "OpenSSL"
          echo "============================================================"

          file "$SSL"

          echo
          "$TARGET-readelf" \
            -l "$SSL" \
            | grep interpreter

          echo
          echo "OpenSSL GLIBC requirements:"

          "$TARGET-readelf" \
            --version-info "$SSL" \
            | grep -o 'GLIBC_[0-9.]*' \
            | sort -Vu \
            || true

          echo
          echo "============================================================"
          echo "Python dependencies"
          echo "============================================================"

          "$TARGET-readelf" \
            -d "$PY" \
            | grep NEEDED \
            || true


      # ============================================================
      # Assemble final Docker build context
      # ============================================================

      - name: Create Docker build context
        shell: bash
        run: |
          set -eux

          CONTEXT="$RUNNER_TEMP/docker-context"

          rm -rf "$CONTEXT"

          mkdir -p \
            "$CONTEXT/openssl-stage/opt" \
            "$CONTEXT/python-stage/opt"

          cp -a \
            "$RUNNER_TEMP/openssl-stage/opt/openssl" \
            "$CONTEXT/openssl-stage/opt/"

          cp -a \
            "$RUNNER_TEMP/python-stage/opt/python" \
            "$CONTEXT/python-stage/opt/"

          cat > "$CONTEXT/Dockerfile" <<'EOF'
          FROM --platform=linux/arm/v7 ubuntu:14.04

          ENV PATH="/opt/python/bin:/opt/openssl/bin:${PATH}"

          ENV LD_LIBRARY_PATH="/opt/python/lib:/opt/openssl/lib"

          COPY openssl-stage/opt/openssl /opt/openssl

          COPY python-stage/opt/python /opt/python

          RUN ln -sf /opt/python/bin/python3.7 /usr/local/bin/python3 \
           && ln -sf /opt/python/bin/python3.7 /usr/local/bin/python \
           && ln -sf /opt/openssl/bin/openssl /usr/local/bin/openssl

          CMD ["/bin/bash"]
          EOF


      # ============================================================
      # Build final ARMv7 Docker image
      # ============================================================

      - name: Build ARMv7 Docker image
        shell: bash
        run: |
          set -eux

          cd "$RUNNER_TEMP/docker-context"

          docker buildx build \
            --platform linux/arm/v7 \
            --load \
            --tag kindle-python:armv7 \
            .


      # ============================================================
      # Test final ARMv7 image
      #
      # QEMU is used here, and ONLY here.
      # ============================================================

      - name: Test ARMv7 Docker image
        shell: bash
        run: |
          set -eux

          docker run \
            --rm \
            --platform linux/arm/v7 \
            kindle-python:armv7 \
            bash -c '
              set -eux

              echo
              echo "============================================================"
              echo "Architecture"
              echo "============================================================"

              uname -m

              echo
              echo "============================================================"
              echo "Operating system"
              echo "============================================================"

              cat /etc/os-release

              echo
              echo "============================================================"
              echo "glibc"
              echo "============================================================"

              ldd --version | head -1

              echo
              echo "============================================================"
              echo "Python"
              echo "============================================================"

              python3.7 --version

              python3.7 \
                -c "import sys; print(sys.version)"

              echo
              echo "============================================================"
              echo "OpenSSL through Python"
              echo "============================================================"

              python3.7 \
                -c "import ssl; print(ssl.OPENSSL_VERSION)"

              echo
              echo "============================================================"
              echo "hashlib"
              echo "============================================================"

              python3.7 \
                -c "import hashlib; print(hashlib.sha256(b\"test\").hexdigest())"

              echo
              echo "============================================================"
              echo "ctypes"
              echo "============================================================"

              python3.7 \
                -c "import ctypes; print(\"ctypes OK\")"

              echo
              echo "============================================================"
              echo "OpenSSL"
              echo "============================================================"

              openssl version

              echo
              echo "============================================================"
              echo "Python shared library"
              echo "============================================================"

              find /opt/python/lib \
                -maxdepth 1 \
                -name "libpython3.7m.so*" \
                -print

              echo
              echo "============================================================"
              echo "Python dynamic dependencies"
              echo "============================================================"

              ldd /opt/python/bin/python3.7
            '


      # ============================================================
      # Export Docker image
      # ============================================================

      - name: Export Docker image
        shell: bash
        run: |
          set -eux

          docker save \
            kindle-python:armv7 \
            | zstd -T0 -19 \
            -o "$GITHUB_WORKSPACE/ubuntu14.04-armv7-python3.7.5-openssl1.1.1w.tar.zst"

          ls -lh \
            "$GITHUB_WORKSPACE/ubuntu14.04-armv7-python3.7.5-openssl1.1.1w.tar.zst"


      # ============================================================
      # Upload artifact
      # ============================================================

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu14.04-armv7-python3.7.5-openssl1.1.1w
          path: ubuntu14.04-armv7-python3.7.5-openssl1.1.1w.tar.zst
          retention-days: 30
