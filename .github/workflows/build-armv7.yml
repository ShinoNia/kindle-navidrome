name: Build ARMv7

on:
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-24.04-arm

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================================
      # CHECK BUILDER
      # ========================================================

      - name: Check ARMv7 builder
        run: |

          if [ ! -f armv7-builder.tar.gz ]; then
            echo "ERROR: armv7-builder.tar.gz is missing"
            echo
            echo "Download the artifact from the"
            echo "'Build ARMv7 Docker' workflow and place it"
            echo "in the repository root."
            exit 1
          fi

          ls -lh armv7-builder.tar.gz


      # ========================================================
      # QEMU
      # ========================================================

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm


      # ========================================================
      # LOAD PREBUILT DOCKER IMAGE
      # ========================================================

      - name: Load ARMv7 Docker image
        run: |

          gunzip -c armv7-builder.tar.gz \
            | docker load


      # ========================================================
      # VERIFY DOCKER IMAGE
      # ========================================================

      - name: Verify ARMv7 environment
        run: |

          echo "Python:"
          docker run --rm \
            --platform linux/arm/v7 \
            kindle-navidrome-armv7:latest \
            /opt/python-3.7.5/bin/python3 \
            --version

          echo
          echo "OpenSSL:"
          docker run --rm \
            --platform linux/arm/v7 \
            kindle-navidrome-armv7:latest \
            /opt/python-3.7.5/bin/python3 \
            -c "import ssl; print(ssl.OPENSSL_VERSION)"


      # ========================================================
      # BUILD APPLICATION
      # ========================================================

      - name: Build ARMv7 application
        run: |

          docker run --rm \
            --platform linux/arm/v7 \
            -v "$PWD:/src" \
            -w /src \
            kindle-navidrome-armv7:latest \
            bash /src/build-armv7.sh


      # ========================================================
      # UPLOAD APPLICATION
      # ========================================================

      - name: Upload ARMv7 application
        uses: actions/upload-artifact@v4

        with:
          name: kindle-navidrome-armv7
          path: dist/
          if-no-files-found: error
